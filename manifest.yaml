display_information:
  name: [DEV] nChannel
  background_color: "#ff00ff"


features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: true

  bot_user:
    display_name: [DEV] nChannel
    always_online: true

  unfurl_domains: # change these to whatever cdn ur using
    - cdn.hackclub.com
    - user-cdn.hackclub-assets.com
  


oauth_config:
  redirect_urls:
    - # change this to whatever url ur using for oauth

  scopes: # most of these arent needed gulp
    user:
      - links.embed:write
      - files:read
      - files:write
    bot:
      - links.embed:write
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - chat:write.customize
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - mpim:history
      - reactions:write
      - users:read
      - links:read
      - links:write
  pkce_enabled: false

settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_mention
      - link_shared

  interactivity:
    is_enabled: true
    
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_mcp_enabled: false
